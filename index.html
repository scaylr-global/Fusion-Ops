<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Scaylr Ops</title>
<style>
  :root {
    --bg:#0A0C10; --sur:#13161D; --sur2:#1A1E27; --sur3:#20242E; --line:rgba(255,255,255,.07);
    --txt:#F2F4F8; --sec:#9AA3B2; --dim:#5D6673;
    --acc:#2DD4BF; --acc-d:#14B8A6; --acc-txt:#05201C; --acc-glow:rgba(45,212,191,.35);
    --green:#34D399; --amber:#FBBF24; --red:#F87171; --blue:#60A5FA; --violet:#A78BFA;
    --r:14px;
  }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  body { background:var(--bg); color:var(--txt); font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,sans-serif; font-size:15px; line-height:1.45; }
  .fade { animation:fade .22s ease; }
  @keyframes fade { from { opacity:0; transform:translateY(4px);} to { opacity:1; transform:none;} }

  .shell { display:flex; min-height:100vh; }
  .side { width:224px; flex:none; position:fixed; top:0; bottom:0; left:0; background:var(--sur); display:flex; flex-direction:column; padding:20px 12px; z-index:30; }
  .side .logo { font-size:15px; font-weight:700; letter-spacing:2px; padding:4px 12px 2px; }
  .side .logo b { color:var(--acc); }
  .side .date { color:var(--dim); font-size:11.5px; padding:0 12px 18px; }
  .side .grp { color:var(--dim); font-size:10.5px; font-weight:700; letter-spacing:1.4px; padding:14px 12px 6px; }
  .side button.nav { display:flex; align-items:center; gap:10px; width:100%; background:none; border:none; color:var(--sec); padding:10px 12px; border-radius:10px; cursor:pointer; font-size:14px; font-weight:500; transition:all .15s; text-align:left; }
  .side button.nav:hover { color:var(--txt); background:var(--sur2); }
  .side button.nav.on { background:var(--sur2); color:var(--acc); font-weight:600; }
  .side .cnt { margin-left:auto; background:var(--acc); color:var(--acc-txt); font-size:11px; font-weight:700; border-radius:99px; padding:1px 8px; }
  .side .cnt.warn { background:var(--red); color:#fff; }
  .side .foot { margin-top:auto; border-top:1px solid var(--line); padding-top:12px; }
  .side .me { display:flex; align-items:center; gap:10px; padding:8px 12px; }
  .init { width:34px; height:34px; border-radius:99px; background:var(--sur3); color:var(--acc); display:inline-flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; flex:none; }
  .init.sm { width:24px; height:24px; font-size:10px; }
  main { flex:1; margin-left:224px; padding:26px 32px 110px; max-width:1160px; }

  h1 { font-size:28px; font-weight:700; letter-spacing:-.4px; margin:4px 0 4px; }
  .sub { color:var(--sec); font-size:14px; margin-bottom:20px; }
  .sect { color:var(--dim); font-size:11.5px; font-weight:600; letter-spacing:1.2px; text-transform:uppercase; margin:28px 0 10px; }
  .topbar { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }

  .btn { background:var(--acc); border:none; color:var(--acc-txt); padding:10px 18px; border-radius:99px; cursor:pointer; font-size:14px; font-weight:600; transition:all .18s; }
  .btn:hover { background:var(--acc-d); }
  .btn:active { transform:scale(.97); }
  .btn.sm { padding:7px 14px; font-size:13px; }
  .ghost { background:var(--sur); border:none; color:var(--sec); padding:9px 16px; border-radius:99px; cursor:pointer; font-size:13.5px; font-weight:500; transition:all .18s; }
  .ghost:hover { background:var(--sur2); color:var(--txt); }
  .ghost.sm { padding:7px 13px; font-size:12.5px; }
  .ghost.danger:hover { color:var(--red); }
  .wa { background:#12352B; color:#4ADE80; }
  .wa:hover { background:#174433; color:#4ADE80; }
  .urg { background:#3A1E1E; color:var(--red); }
  .urg:hover { background:#4A2626; color:var(--red); }

  .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:12px; margin:18px 0 6px; }
  .scard { background:var(--sur); border-radius:var(--r); padding:16px 18px; }
  .scard .g { font-size:17px; margin-bottom:10px; display:inline-flex; width:34px; height:34px; border-radius:10px; align-items:center; justify-content:center; background:var(--sur2); }
  .scard .v { font-size:26px; font-weight:700; font-variant-numeric:tabular-nums; line-height:1.15; }
  .scard .t { color:var(--sec); font-size:13px; font-weight:500; }
  .scard .s { color:var(--dim); font-size:12px; }
  .twin { display:grid; grid-template-columns:1fr 300px; gap:12px; align-items:stretch; }
  @media (max-width:900px){ .twin { grid-template-columns:1fr; } }
  .panel { background:var(--sur); border-radius:var(--r); padding:18px 20px; }
  .panel h3 { font-size:12px; color:var(--dim); font-weight:600; letter-spacing:1.2px; text-transform:uppercase; margin-bottom:12px; }

  .ring { position:relative; width:110px; height:110px; margin:6px auto; cursor:pointer; }
  .ring svg { transform:rotate(-90deg); }
  .ring .pc { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; font-size:19px; font-weight:700; }
  .ring .pc small { font-size:9.5px; color:var(--dim); font-weight:600; letter-spacing:.5px; }

  .list { background:var(--sur); border-radius:var(--r); overflow:hidden; }
  .item { display:flex; align-items:center; gap:12px; padding:14px 18px; cursor:pointer; transition:background .15s; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  .item:last-child { border-bottom:none; }
  .item:hover { background:var(--sur2); }
  .item.urgent { box-shadow:inset 3px 0 0 var(--red); }
  .empty { color:var(--dim); padding:28px 18px; text-align:center; font-size:14px; }

  .dot { width:8px; height:8px; border-radius:99px; flex:none; }
  .d-New { background:var(--blue);} .d-Contacted { background:var(--violet);} .d-MeetingSet { background:var(--amber);} .d-OnHold { background:var(--dim);} .d-ClosedWon { background:var(--green);} .d-ClosedLost { background:#3A404A;}
  .meta { color:var(--sec); font-size:13px; }
  .fine { color:var(--dim); font-size:12.5px; }
  .money { color:var(--green); font-weight:600; font-variant-numeric:tabular-nums; }
  .over { color:var(--red); font-weight:600; }
  .todayc { color:var(--amber); font-weight:600; }
  .stale { color:var(--amber); font-size:12px; font-weight:600; }
  .score { font-size:11px; font-weight:700; padding:3px 8px; border-radius:99px; font-variant-numeric:tabular-nums; flex:none; }
  .sc-hot { background:#173A2A; color:var(--green); }
  .sc-warm { background:#3A2F14; color:var(--amber); }
  .sc-cold { background:var(--sur2); color:var(--dim); }
  .flag { color:var(--red); font-size:13px; font-weight:700; }

  .board { display:flex; gap:12px; overflow-x:auto; padding:4px 2px 18px; align-items:flex-start; }
  .col { background:var(--sur); border-radius:var(--r); min-width:230px; width:230px; flex:none; padding:12px; transition:background .15s; }
  .col.dragover { background:var(--sur2); outline:1.5px dashed var(--acc); outline-offset:-4px; }
  .col h4 { font-size:12px; color:var(--sec); font-weight:600; letter-spacing:.8px; text-transform:uppercase; padding:2px 6px 10px; display:flex; justify-content:space-between; }
  .cardl { background:var(--sur2); border-radius:11px; padding:12px 14px; margin-bottom:8px; cursor:pointer; transition:all .15s; }
  .cardl:hover { transform:translateY(-1px); background:var(--sur3); }
  .cardl.urgent { box-shadow:inset 3px 0 0 var(--red); }
  .cardl .nm { font-weight:600; font-size:14px; }

  .toolbar { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; align-items:center; }
  .toolbar input[type=search] { flex:1; min-width:160px; }
  .toolbar select { width:auto; }

  .modal-bg { position:fixed; inset:0; background:rgba(0,0,0,.65); display:flex; align-items:flex-end; justify-content:center; z-index:50; animation:fade .18s ease; backdrop-filter:blur(3px); }
  .sheet { background:var(--sur); border-radius:20px 20px 0 0; padding:24px 22px calc(24px + env(safe-area-inset-bottom)); width:100%; max-width:640px; max-height:90vh; overflow:auto; animation:up .25s cubic-bezier(.3,1,.4,1); }
  @keyframes up { from { transform:translateY(40px); opacity:.4;} to { transform:none; opacity:1;} }
  @media (min-width:640px){ .modal-bg { align-items:center; padding:24px; } .sheet { border-radius:20px; } }
  .grab { width:36px; height:4px; border-radius:99px; background:var(--line); margin:-8px auto 16px; }
  label { display:block; font-size:12px; color:var(--dim); font-weight:600; margin:14px 0 5px; letter-spacing:.5px; }
  input, select, textarea { width:100%; background:var(--bg); border:1px solid var(--line); border-radius:10px; color:var(--txt); padding:11px 12px; font-size:15px; font-family:inherit; transition:border .18s; -webkit-appearance:none; }
  input:focus, select:focus, textarea:focus { outline:none; border-color:var(--acc); }
  textarea { resize:vertical; min-height:60px; }
  .m-foot { display:flex; gap:10px; justify-content:flex-end; margin-top:22px; align-items:center; }
  .err { color:var(--red); font-size:13px; margin-top:10px; min-height:16px; }

  .seg { display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; }
  .seg button { font-size:12.5px; padding:7px 13px; border-radius:99px; border:none; background:var(--sur2); color:var(--sec); cursor:pointer; font-weight:500; transition:all .15s; }
  .seg button.on { background:var(--acc); color:var(--acc-txt); font-weight:600; }

  .tabs { display:flex; gap:2px; margin:18px 0 0; border-bottom:1px solid var(--line); }
  .tabs button { background:none; border:none; color:var(--sec); padding:10px 14px; cursor:pointer; font-size:13.5px; font-weight:500; border-bottom:2px solid transparent; transition:all .15s; }
  .tabs button.on { color:var(--acc); border-bottom-color:var(--acc); font-weight:600; }
  .tabbody { padding-top:16px; }

  .gp { background:var(--sur2); border-radius:12px; padding:16px; margin-top:12px; }
  .gp .row { display:flex; gap:12px; padding:10px 0; border-bottom:1px solid var(--line); align-items:flex-start; }
  .gp .row:last-child { border:none; }
  .gp .num { width:22px; height:22px; border-radius:99px; background:var(--sur3); color:var(--acc); font-size:11px; font-weight:700; display:flex; align-items:center; justify-content:center; flex:none; margin-top:1px; }
  .gp .k { color:var(--dim); font-size:10.5px; font-weight:700; letter-spacing:1px; }
  .gp .v { font-size:14px; margin-top:2px; }
  .gpbar { height:5px; background:var(--sur3); border-radius:99px; margin:10px 0 4px; overflow:hidden; }
  .gpbar i { display:block; height:100%; background:var(--acc); border-radius:99px; }
  .copy { background:var(--sur3); border:none; color:var(--sec); font-size:10.5px; font-weight:700; letter-spacing:.6px; padding:3px 9px; border-radius:6px; cursor:pointer; margin-left:8px; }
  .copy:hover { color:var(--txt); }

  .int { padding:10px 0; border-bottom:1px solid var(--line); font-size:14px; }
  .int:last-child { border:none; }
  .chip { background:var(--sur2); border-radius:6px; padding:2px 8px; font-size:11.5px; color:var(--sec); font-weight:500; }

  .fab { position:fixed; right:22px; bottom:calc(84px + env(safe-area-inset-bottom)); width:54px; height:54px; border-radius:99px; background:var(--acc); color:var(--acc-txt); border:none; font-size:26px; cursor:pointer; box-shadow:0 6px 24px var(--acc-glow); z-index:40; transition:all .18s; line-height:1; display:none; }
  .fab:active { transform:scale(.94); }

  nav.bottom { display:none; }
  @media (max-width:820px){
    .side { display:none; }
    main { margin-left:0; padding:20px 18px 110px; }
    .fab { display:block; }
    nav.bottom { display:flex; position:fixed; left:0; right:0; bottom:0; background:rgba(19,22,29,.92); backdrop-filter:blur(14px); border-top:1px solid var(--line); z-index:40; padding-bottom:env(safe-area-inset-bottom); }
    nav.bottom button { flex:1; background:none; border:none; color:var(--dim); padding:11px 0 13px; cursor:pointer; font-size:10.5px; font-weight:600; display:flex; flex-direction:column; gap:3px; align-items:center; }
    nav.bottom button.on { color:var(--acc); }
    nav.bottom .glyph { font-size:18px; line-height:1; }
  }

  #toasts { position:fixed; bottom:calc(76px + env(safe-area-inset-bottom)); left:0; right:0; display:flex; flex-direction:column; align-items:center; gap:8px; z-index:60; pointer-events:none; }
  @media (min-width:821px){ #toasts { bottom:24px; } }
  .toast { background:var(--sur2); color:var(--txt); border:1px solid var(--line); border-radius:99px; padding:10px 20px; font-size:13.5px; font-weight:500; animation:up .25s ease; box-shadow:0 8px 30px rgba(0,0,0,.4); }
  .auth { max-width:360px; margin:14vh auto 0; padding:0 18px; }
  .auth .card { background:var(--sur); border-radius:20px; padding:28px 24px; }
  .auth h2 { font-size:20px; margin-bottom:4px; }
</style>
</head>
<body>
<div id="app"></div>
<div id="toasts"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
"use strict";
const STATUSES = ["New","Contacted","Meeting Set","On Hold","Closed Won","Closed Lost"];
const OPEN_ST = ["New","Contacted","Meeting Set"];
const ACTIVE_ST = ["New","Contacted","Meeting Set","On Hold"];
const SOURCES = ["Instagram","Facebook","WhatsApp","Referral","Other"];
const PIN_DOMAIN = "fusionops.local";
let sb=null, user=null, D={clients:[],leads:[],followups:[],interactions:[],team:[]}, view="dash", modal=null, errMsg="", boardClient="all", dragId=null;
let flt = { q:"", st:"Active", src:"all" };

const $ = s => document.querySelector(s);
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pref = () => { try { return JSON.parse(localStorage.getItem("scaylr_pref")||"{}"); } catch(e){ return {}; } };
const setPref = o => { localStorage.setItem("scaylr_pref", JSON.stringify(Object.assign(pref(), o))); applyAccent(); };
const CUR = () => pref().cur || "LKR";
const money = n => (CUR()==="USD"?"$":"LKR ") + Number(n||0).toLocaleString(undefined,{maximumFractionDigits:0});
const today = () => new Date().toISOString().slice(0,10);
const fmtD = d => d ? new Date(d+"T00:00:00").toLocaleDateString(undefined,{day:"numeric",month:"short"}) : "";
const dcls = s => "d-"+s.replace(/\s/g,"");
const clientOf = l => D.clients.find(c=>c.id===l.client_id);
const cfg = () => { try { return JSON.parse(localStorage.getItem("scaylr_cfg")||"null"); } catch(e){ return null; } };
const myUsername = () => user && user.email ? user.email.split("@")[0] : "me";
const myName = () => pref().name || myUsername().split(/[._-]/)[0].replace(/^./,c=>c.toUpperCase());
const initials = s => { const p=String(s||"").split(/[._\s-]+/).filter(Boolean); return ((p[0]||" ")[0]+(p[1]?p[1][0]:(p[0]||"  ")[1]||"")).toUpperCase(); };
const teamRec = un => (D.team||[]).find(t=>t.username===un);
const dispName = un => { const t=teamRec(un); return t&&t.display_name?t.display_name:un; };
const assigneeOf = l => l.assigned_to || l.owner || "";
function getScope(){ const p=pref().scope; if(p) return p; const t=teamRec(myUsername()); return t&&t.client_id?"mine":"all"; }
function setScope(s){ setPref({scope:s}); render(); }
function inScope(l){ return getScope()==="all" || assigneeOf(l)===myUsername(); }
function scopeSeg(){ const sc=getScope(); return `<div class="seg"><button class="${sc==='mine'?'on':''}" onclick="setScope('mine')">Mine</button><button class="${sc==='all'?'on':''}" onclick="setScope('all')">Everyone</button></div>`; }
function assignLead(id,un){
  const l=D.leads.find(x=>x.id===id); if(!l) return;
  l.assigned_to=un;
  modal={type:"lead-view",id,tab:(modal&&modal.tab)||"details"}; render();
  toast(un?"Assigned to "+dispName(un):"Unassigned");
  sb.from("leads").update({assigned_to:un}).eq("id",id).then(r=>{ if(r.error) toast("Run the v5 SQL in Supabase first"); });
}
function avatarOf(l){ const a=assigneeOf(l); return a?`<span class="init sm" title="${esc(dispName(a))}">${initials(dispName(a))}</span>`:""; }

function applyAccent(){
  const orange = pref().acc==="orange";
  const r = document.documentElement.style;
  r.setProperty("--acc", orange?"#FB923C":"#2DD4BF");
  r.setProperty("--acc-d", orange?"#F97316":"#14B8A6");
  r.setProperty("--acc-txt", orange?"#331303":"#05201C");
  r.setProperty("--acc-glow", orange?"rgba(251,146,60,.35)":"rgba(45,212,191,.35)");
}
function toast(msg){
  const t=document.createElement("div");
  t.className="toast"; t.textContent=msg;
  $("#toasts").appendChild(t);
  setTimeout(()=>{ t.style.opacity="0"; t.style.transition="opacity .3s"; setTimeout(()=>t.remove(),320); },2400);
}

async function boot(){
  applyAccent();
  const c=cfg();
  if(!c){ render(); return; }
  sb=window.supabase.createClient(c.url,c.key);
  const { data }=await sb.auth.getSession();
  user=data.session?data.session.user:null;
  if(user) await loadAll();
  render();
}
async function loadAll(){
  const [c,l,f,i,t]=await Promise.all([
    sb.from("clients").select("*").order("created_at"),
    sb.from("leads").select("*").order("created_at",{ascending:false}),
    sb.from("followups").select("*").order("due_date"),
    sb.from("interactions").select("*").order("created_at",{ascending:false}),
    sb.from("team").select("*").order("created_at")
  ]);
  D={ clients:c.data||[], leads:l.data||[], followups:f.data||[], interactions:i.data||[], team:t.data||[] };
}
async function hardRefresh(){ await loadAll(); render(); }
function syncFail(){ toast("Sync failed — reloading"); hardRefresh(); }

/* ---------- auth ---------- */
async function saveSetup(){
  const url=$("#su-url").value.trim(), key=$("#su-key").value.trim();
  if(!url||!key){ errMsg="Please fill both fields."; render(); return; }
  localStorage.setItem("scaylr_cfg", JSON.stringify({url,key}));
  errMsg=""; await boot();
}
async function signIn(){
  errMsg="";
  let un=$("#li-un").value.trim(), pin=$("#li-pin").value;
  const email = un.includes("@") ? un : un.toLowerCase().replace(/\s+/g,"")+"@"+PIN_DOMAIN;
  if(!un.includes("@") && /^\d{4}$/.test(pin)) pin = pin + "00";
  const { data, error }=await sb.auth.signInWithPassword({ email, password:pin });
  if(error){ errMsg="Wrong username or PIN."; render(); return; }
  user=data.user; await loadAll(); render();
}
async function signOut(){ await sb.auth.signOut(); user=null; render(); }

/* ---------- derived ---------- */
function commissionFor(l){
  const c=clientOf(l);
  return (Number(l.deal_value)||0)*((c?Number(c.commission_pct):10)/100);
}
function monthWon(){
  const n=new Date();
  return D.leads.filter(l=>l.status==="Closed Won"&&l.closed_at&&new Date(l.closed_at).getMonth()===n.getMonth()&&new Date(l.closed_at).getFullYear()===n.getFullYear());
}
function lastTouch(l){
  const ints=D.interactions.filter(i=>i.lead_id===l.id);
  let t=new Date(l.created_at).getTime();
  ints.forEach(i=>{ const x=new Date(i.created_at).getTime(); if(x>t)t=x; });
  return t;
}
function daysSince(l){ return Math.floor((Date.now()-lastTouch(l))/86400000); }
function nextFup(l){ return D.followups.filter(f=>f.lead_id===l.id&&!f.done).sort((a,b)=>a.due_date<b.due_date?-1:1)[0]; }
function extraFieldNames(client){
  return (client&&client.extra_fields?client.extra_fields.split(","):[]).map(s=>s.trim()).filter(Boolean);
}
function score(l){
  if(l.status==="Closed Won") return 100;
  if(l.status==="Closed Lost") return 0;
  const stage={ "New":15, "Contacted":35, "Meeting Set":65, "On Hold":20 }[l.status]||0;
  const acts=Math.min(D.interactions.filter(i=>i.lead_id===l.id).length*4, 16);
  const ds=daysSince(l);
  const rec=ds<=1?12:ds<=4?6:ds>=10?-12:0;
  const fu=nextFup(l)?8:-4;
  const val=(Number(l.deal_value)||0)>0?5:0;
  return Math.max(0, Math.min(99, stage+acts+rec+fu+val));
}
function scoreBadge(l){
  const s=score(l);
  const c=s>=60?"sc-hot":s>=35?"sc-warm":"sc-cold";
  return `<span class="score ${c}">${s}</span>`;
}
function phoneOf(l){
  let d=String(l.contact||"").replace(/[^\d+]/g,"");
  if(!d) return null;
  if(d.startsWith("+")) d=d.slice(1);
  if(d.startsWith("00")) d=d.slice(2);
  if(d.startsWith("0")&&d.length===10) d="94"+d.slice(1);
  else if(d.length===9&&d.startsWith("7")) d="94"+d;
  return d.length>=10?d:null;
}
function waOpen(id){
  const l=D.leads.find(x=>x.id===id); const p=phoneOf(l);
  if(!p){ toast("No valid phone number on this lead"); return; }
  const msg=encodeURIComponent("Hi "+l.name+", just following up on our conversation. Is this a good time to chat?");
  window.open("https://wa.me/"+p+"?text="+msg,"_blank");
}
function callOpen(id){
  const l=D.leads.find(x=>x.id===id); const p=phoneOf(l);
  if(!p){ toast("No valid phone number on this lead"); return; }
  location.href="tel:+"+p;
}
function copyTxt(t){
  navigator.clipboard.writeText(t).then(()=>toast("Copied"));
}

/* ---------- game plan ---------- */
function gamePlan(l){
  const c=clientOf(l)||{};
  const ds=daysSince(l);

  const long = ds>=7;
  let p;
  if(l.status==="New") p={

  else if(l.status==="Contacted") p={

    watch:"Hesitation on budget or timing — surface it early and handle it, don't talk past it.",

  };
  else if(l.status==="Meeting Set") p={
    obj:"Confirm the meeting and arrive prepared to close",
    open:"Hi "+l.name+", looking forward to our chat! Just confirming we're on. I'll keep it short and useful.",
    emph:"Preparation — reread the notes and requirements below before the call.",
    watch:"No-shows. Confirm the morning of the meeting; offer to reschedule instantly if needed.",
    close:"End the meeting with a clear decision timeline — a yes, a no, or a date for one."
  };
  else if(l.status==="On Hold") p={
    obj:"Re-open the conversation with a fresh reason",
    open:"Hi "+l.name+", you crossed my mind — "+cn+" has something new that might fit what you were looking at. Worth a quick look?",
    emph:"New information. A parked lead re-engages for a new offer, a deadline, or a result — never a repeat of the old pitch.",
    watch:"If they go silent twice more, set one final follow-up and let it rest.",
    close:"Any small commitment that restarts momentum — a reply, a call, a maybe."
  };
  else if(l.status==="Closed Won") p={
    obj:"Protect the win and open the door to the next one",
    open:"Hi "+l.name+", great to have everything confirmed! Anything you need from our side, I'm one message away.",
    emph:"Aftercare. A happy closed customer is the cheapest source of referrals you will ever get.",
    watch:"Silence after payment — check in before they have a reason to complain.",
    close:"Ask for a referral or a review once they've seen first results."
  };
  else p={
    obj:"Learn why it was lost, keep the door open",
    open:"Hi "+l.name+", totally understand. If anything changes down the line, I'd be glad to pick this back up.",
    emph:"One honest question: what made the difference? The answer improves every future deal.",
    watch:"Don't burn the bridge — many lost deals return in 3–6 months.",
    close:"Leave a good last impression and park a follow-up 90 days out."
  };
  if(val>0 && l.status!=="Closed Won" && l.status!=="Closed Lost")
    p.money="On the table: "+money(val)+" — your commission if won: "+money(commissionFor(l))+".";
  return p;
}

function parseCSV(text){
  const rows=[]; let row=[], cur="", inQ=false;
  text=text.replace(/\r\n?/g,"\n");
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(inQ){
      if(ch==='"'){ if(text[i+1]==='"'){ cur+='"'; i++; } else inQ=false; }
      else cur+=ch;
    } else {
      if(ch==='"') inQ=true;
      else if(ch===","){ row.push(cur); cur=""; }
      else if(ch==="\n"){ row.push(cur); cur=""; if(row.some(c=>c.trim()!=="")) rows.push(row); row=[]; }
      else cur+=ch;
    }
  }
  if(cur!==""||row.length){ row.push(cur); if(row.some(c=>c.trim()!=="")) rows.push(row); }
  return rows;
}
const IMP_FIELDS=[["name","Lead name"],["contact","Contact / phone"],["source","Source"],["deal_value","Deal value"],["status","Status"],["notes","Notes"],["","— skip —"]];
function guessMap(headers){
  const m={};
  headers.forEach((h,i)=>{
    const s=h.toLowerCase();
    if(/name|lead|business|company|customer/.test(s)&&m.name===undefined) m.name=i;
    else if(/phone|contact|number|mobile|whatsapp|tel/.test(s)&&m.contact===undefined) m.contact=i;
    else if(/source|channel|platform/.test(s)&&m.source===undefined) m.source=i;
    else if(/value|deal|amount|price|worth/.test(s)&&m.deal_value===undefined) m.deal_value=i;
    else if(/status|stage/.test(s)&&m.status===undefined) m.status=i;
    else if(/note|comment|remark|detail/.test(s)&&m.notes===undefined) m.notes=i;
  });
  return m;
}
function impFile(ev){
  const f=ev.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{
    const rows=parseCSV(String(r.result));
    if(rows.length<2){ toast("That file looks empty"); return; }
    modal={type:"import", headers:rows[0], rows:rows.slice(1), map:guessMap(rows[0]), clientId:(D.clients[0]&&D.clients[0].id)||"", dedupe:true};
    render();
  };
  r.readAsText(f);
}

function normStatus(s){
  s=String(s||"").toLowerCase();
  if(/won|closed.?w|sold|converted/.test(s)) return "Closed Won";
  if(/lost|closed.?l|dead|reject/.test(s)) return "Closed Lost";
  if(/hold|pause|park/.test(s)) return "On Hold";
  if(/meet|appoint|discovery|demo|call.?set/.test(s)) return "Meeting Set";
  if(/contact|follow|progress|talk|reply/.test(s)) return "Contacted";
  return "New";
}
async function doImport(){
  const m=modal.map;
  if(m.name===undefined){ errMsg="Map at least the Lead name column."; render(); return; }
  if(!modal.clientId){ errMsg="Pick a client."; render(); return; }
  errMsg="";
  const digits=s=>String(s||"").replace(/\D/g,"");
  const existing=D.leads.filter(l=>l.client_id===modal.clientId);
  const seen=new Set(existing.map(l=>digits(l.contact)).filter(Boolean));
  const seenNames=new Set(existing.map(l=>String(l.name||"").trim().toLowerCase()));
  const batch=[];
  let skipped=0;
  modal.rows.forEach(r=>{
    const g=f=>m[f]!==undefined?String(r[m[f]]||"").trim():"";
    const name=g("name"); if(!name) return;
    const contact=g("contact");
    if(modal.dedupe&&((contact&&seen.has(digits(contact)))||seenNames.has(name.toLowerCase()))){ skipped++; return; }
    if(contact) seen.add(digits(contact));
    seenNames.add(name.toLowerCase());
    const src=g("source"); const known=SOURCES.find(s=>s.toLowerCase()===src.toLowerCase());
    batch.push({ client_id:modal.clientId, name, contact, source:known||(src?"Other":"Other"),
      deal_value:parseFloat(String(g("deal_value")).replace(/[^\d.]/g,""))||0,
      status:m.status!==undefined?normStatus(g("status")):"New",
      notes:g("notes"), extra:{}, owner:myUsername(), assigned_to:myUsername() });
  });
  if(!batch.length){ errMsg="Nothing new to import"+(skipped?" — "+skipped+" duplicates skipped.":"."); render(); return; }
  let r=await sb.from("leads").insert(batch);
  if(r.error){
    const plain=batch.map(b=>{ const c=Object.assign({},b); delete c.owner; delete c.assigned_to; return c; });
    r=await sb.from("leads").insert(plain);
  }
  if(r.error){ errMsg=r.error.message; render(); return; }
  modal=null; await hardRefresh();
  toast("Imported "+batch.length+" leads"+(skipped?" · "+skipped+" duplicates skipped":""));
}

async function saveTeam(id){
  const b={ username:$("#t-un").value.trim().toLowerCase().replace(/\s+/g,""), display_name:$("#t-dn").value.trim(), client_id:$("#t-cl").value||null };
  if(!b.username){ errMsg="Username is required."; render(); return; }
  errMsg="";
  let r;
  if(id) r=await sb.from("team").update(b).eq("id",id);
  else r=await sb.from("team").insert(b);
  if(r.error){ errMsg=r.error.message.includes("relation")?"Run the v5 SQL in Supabase first.":r.error.message; render(); return; }
  modal=null; await hardRefresh(); toast("Team saved");
}
async function delTeam(id){
  if(!confirm("Remove this team member? Their leads stay, just unassigned from them.")) return;
  await sb.from("team").delete().eq("id",id);

}

      <div class="row"><span class="num">5</span><div><div class="k">CLOSE ON</div><div class="v">${esc(gp.close)}</div></div></div>
    </div>
    ${ints.length?`<p class="fine" style="margin-top:12px">Last interaction: ${esc(ints[0].kind)} — ${esc(ints[0].note)}</p>`:""}`;
  if(tab==="activity") body=`
    <div style="display:flex;gap:8px;margin-bottom:6px">
      <select id="i-kind" style="width:110px"><option>DM</option><option>WhatsApp</option><option>Call</option><option>Meeting</option><option>Note</option></select>
      <input id="i-note" placeholder="What happened?" style="flex:1" onkeydown="if(event.key==='Enter')addInteraction('${l.id}')">
      <button class="btn sm" onclick="addInteraction('${l.id}')">Log</button>
    </div>
    ${ints.length?ints.map(i=>`<div class="int"><span class="chip">${esc(i.kind)}</span> <span class="fine">${new Date(i.created_at).toLocaleDateString(undefined,{day:"numeric",month:"short"})}${i.created_by?" · "+esc(i.created_by):""}</span><div style="margin-top:4px">${esc(i.note)}</div></div>`).join(""):`<p class="fine">Nothing logged yet.</p>`}`;
  if(tab==="fups") body=`
    ${fups.length?fups.map(f=>`
      <div style="display:flex;gap:10px;align-items:center;padding:5px 0">
        <input type="checkbox" ${f.done?"checked":""} style="width:17px;height:17px;accent-color:var(--acc)" onchange="toggleFup('${f.id}',this.checked);modal={type:'lead-view',id:'${l.id}',tab:'fups'}">
        <span class="${f.done?'fine':(f.due_date<today()?'over':f.due_date===today()?'todayc':'meta')}" style="${f.done?'text-decoration:line-through':''}">${fmtD(f.due_date)}</span>
        <span class="fine">${esc(f.note||"")}</span>
      </div>`).join(""):`<p class="fine">None yet — set one so this lead never goes cold.</p>`}
    <div style="display:flex;gap:8px;margin-top:10px">
      <input id="f-due" type="date" value="${today()}" style="width:150px">
      <input id="f-note" placeholder="e.g. send package details" style="flex:1">
      <button class="btn sm" onclick="addFollowup('${l.id}')">Add</button>
    </div>`;
  if(tab==="details") body=`
    <label style="margin-top:0">Assigned to</label>
    <select onchange="assignLead('${l.id}',this.value)" style="max-width:260px">
      <option value="">Unassigned</option>
      ${D.team.map(t=>`<option value="${esc(t.username)}" ${assigneeOf(l)===t.username?"selected":""}>${esc(t.display_name||t.username)}</option>`).join("")}
    </select>
    <p style="margin:14px 0 4px"><span class="fine">Contact</span> &nbsp;${esc(l.contact||"—")}</p>
    <p style="margin:4px 0"><span class="fine">Source</span> &nbsp;${esc(l.source||"—")}</p>
    <p style="margin:4px 0"><span class="fine">Added by</span> &nbsp;${esc(l.owner||"—")}</p>
    <p style="margin:4px 0"><span class="fine">Added</span> &nbsp;${new Date(l.created_at).toLocaleDateString(undefined,{day:"numeric",month:"short",year:"numeric"})}</p>
    ${Number(l.deal_value)?`<p style="margin:4px 0"><span class="fine">Deal</span> &nbsp;<span class="money">${money(l.deal_value)}</span> → commission <span class="money">${money(commissionFor(l))}</span>${l.status!=="Closed Won"?' <span class="fine">(if won)</span>':''}</p>`:""}
    ${extras.map(([k,v])=>`<p style="margin:4px 0"><span class="fine">${esc(k)}</span> &nbsp;${esc(v)}</p>`).join("")}
    ${l.notes?`<div class="sect" style="margin-top:14px">Notes</div><p class="meta" style="white-space:pre-wrap">${esc(l.notes)}</p>`:""}
    <div style="margin-top:16px"><button class="ghost sm" onclick="modal={type:'lead-edit',id:'${l.id}'};render()">Edit details</button></div>`;
  return `
  <div style="display:flex;align-items:flex-start;gap:12px">
    <div>
      <h2 style="font-size:20px">${esc(l.name)} ${l.urgent?'<span class="flag">!</span>':''} ${scoreBadge(l)}</h2>
      <p class="meta" style="margin-top:2px">${esc(c?c.name:"")} · ${esc(l.source)}${l.contact?" · "+esc(l.contact):""}${ACTIVE_ST.includes(l.status)?` · <span class="${ds>=5?'stale':'fine'}">${ds===0?"touched today":"in "+l.status+" for "+ds+"d"}</span>`:""}</p>
    </div>
    <div class="spacer" style="flex:1"></div>
    <button class="ghost sm" onclick="modal=null;errMsg='';render()">✕</button>
  </div>
  <div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap">
    ${p?`<button class="ghost sm wa" onclick="waOpen('${l.id}')">WhatsApp</button><button class="ghost sm" onclick="callOpen('${l.id}')">Call</button>`:""}
    <button class="ghost sm ${l.urgent?'urg':''}" onclick="toggleUrgent('${l.id}')">${l.urgent?"Urgent ✓":"Mark urgent"}</button>
    <button class="ghost sm danger" onclick="delLead('${l.id}')">Delete</button>
  </div>
  <div class="seg">${STATUSES.map(st=>`<button class="${l.status===st?'on':''}" onclick="setStatus('${l.id}','${st}')">${st}</button>`).join("")}</div>
  <div class="tabs">
    ${tabBtn("prep","Call Prep")}
    ${tabBtn("activity","Activity",ints.length)}
    ${tabBtn("fups","Follow-Ups",fups.filter(f=>!f.done).length)}
    ${tabBtn("details","Details")}
  </div>
  <div class="tabbody">${body}</div>
  <div class="err">${esc(errMsg)}</div>`;
}

boot();
</script>
</body>
</html>
