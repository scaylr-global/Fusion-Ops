<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scaylr Ops</title>
<style>
  :root { --bg:#0B1220; --card:#111A2E; --card2:#182338; --line:#22304C; --teal:#14B8A6; --teal-d:#0D9488; --txt:#E5EAF3; --mut:#8B98B0; --red:#F87171; --amber:#FBBF24; --green:#4ADE80; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--txt); font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; font-size:15px; }
  a { color:var(--teal); text-decoration:none; }
  .wrap { max-width:1100px; margin:0 auto; padding:16px; }
  header { display:flex; align-items:center; gap:16px; padding:14px 0; border-bottom:1px solid var(--line); margin-bottom:20px; flex-wrap:wrap; }
  .logo { font-weight:700; font-size:18px; letter-spacing:1px; }
  .logo span { color:var(--teal); }
  nav { display:flex; gap:6px; flex-wrap:wrap; }
  nav button { background:none; border:none; color:var(--mut); padding:8px 14px; border-radius:8px; cursor:pointer; font-size:14px; font-weight:500; }
  nav button.on { background:var(--card2); color:var(--txt); }
  nav button:hover { color:var(--txt); }
  .spacer { flex:1; }
  .ghost { background:none; border:1px solid var(--line); color:var(--mut); padding:7px 12px; border-radius:8px; cursor:pointer; font-size:13px; }
  .ghost:hover { color:var(--txt); border-color:var(--mut); }
  .btn { background:var(--teal); border:none; color:#04241F; padding:9px 16px; border-radius:8px; cursor:pointer; font-size:14px; font-weight:600; }
  .btn:hover { background:var(--teal-d); }
  .btn.sm { padding:6px 12px; font-size:13px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; }
  .grid { display:grid; gap:12px; }
  .g4 { grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); }
  .g2 { grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); }
  .stat .lab { color:var(--mut); font-size:12px; margin-bottom:6px; text-transform:uppercase; letter-spacing:.5px; }
  .stat .val { font-size:26px; font-weight:700; }
  h2 { font-size:17px; margin:22px 0 10px; }
  h3 { font-size:15px; margin:0 0 10px; }
  .row { display:flex; align-items:center; gap:10px; padding:11px 12px; border-bottom:1px solid var(--line); cursor:pointer; flex-wrap:wrap; }
  .row:last-child { border-bottom:none; }
  .row:hover { background:var(--card2); }
  .pill { font-size:11px; font-weight:600; padding:3px 10px; border-radius:99px; white-space:nowrap; }
  .s-New { background:#1E3A5F; color:#7DB8F0; }
  .s-Contacted { background:#3A2F5F; color:#B49DF0; }
  .s-MeetingSet { background:#4A3A1E; color:#F0CC7D; }
  .s-ClosedWon { background:#173A2A; color:#5FDF9F; }
  .s-ClosedLost { background:#3A1E1E; color:#F09D9D; }
  .mut { color:var(--mut); font-size:13px; }
  .due-over { color:var(--red); font-weight:600; }
  .due-today { color:var(--amber); font-weight:600; }
  .modal-bg { position:fixed; inset:0; background:rgba(0,0,0,.6); display:flex; align-items:flex-start; justify-content:center; padding:30px 16px; overflow:auto; z-index:10; }
  .modal { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:20px; width:100%; max-width:560px; }
  label { display:block; font-size:12px; color:var(--mut); margin:12px 0 4px; text-transform:uppercase; letter-spacing:.5px; }
  input, select, textarea { width:100%; background:var(--bg); border:1px solid var(--line); border-radius:8px; color:var(--txt); padding:9px 10px; font-size:14px; font-family:inherit; }
  input:focus, select:focus, textarea:focus { outline:none; border-color:var(--teal); }
  textarea { resize:vertical; min-height:64px; }
  .m-foot { display:flex; gap:10px; justify-content:flex-end; margin-top:18px; }
  .danger { color:var(--red); border-color:#5f2222; }
  .center { text-align:center; }
  .auth-box { max-width:380px; margin:10vh auto; }
  .flex { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .tag { background:var(--card2); border:1px solid var(--line); border-radius:6px; padding:2px 8px; font-size:12px; color:var(--mut); }
  .int { border-left:2px solid var(--line); padding:6px 0 6px 12px; margin-bottom:8px; }
  .empty { color:var(--mut); padding:24px; text-align:center; }
  .err { color:var(--red); font-size:13px; margin-top:10px; min-height:18px; }
  .statusbtns { display:flex; gap:6px; flex-wrap:wrap; margin-top:6px; }
  .statusbtns button { font-size:12px; padding:5px 10px; border-radius:99px; border:1px solid var(--line); background:none; color:var(--mut); cursor:pointer; }
  .statusbtns button.on { border-color:var(--teal); color:var(--teal); font-weight:600; }
  .money { color:var(--green); font-weight:600; }
  @media (max-width:600px){ .row { gap:6px; } }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
"use strict";
const STATUSES = ["New","Contacted","Meeting Set","Closed Won","Closed Lost"];
const SOURCES = ["Instagram","Facebook","WhatsApp","Referral","Other"];
let sb=null, user=null, D={clients:[],leads:[],followups:[],interactions:[]}, view="dash", modal=null, leadFilter={client:"all",status:"open"}, errMsg="";

const $ = s => document.querySelector(s);
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money = n => "$" + Number(n||0).toLocaleString(undefined,{maximumFractionDigits:0});
const today = () => new Date().toISOString().slice(0,10);
const fmtD = d => d ? new Date(d+"T00:00:00").toLocaleDateString(undefined,{day:"numeric",month:"short"}) : "";
const cls = s => "s-"+s.replace(/\s/g,"");
const clientOf = l => D.clients.find(c=>c.id===l.client_id);

function cfg(){ try { return JSON.parse(localStorage.getItem("scaylr_cfg")||"null"); } catch(e){ return null; } }

async function boot(){
  const c = cfg();
  if(!c){ render(); return; }
  sb = window.supabase.createClient(c.url, c.key);
  const { data } = await sb.auth.getSession();
  user = data.session ? data.session.user : null;
  if(user) await loadAll();
  render();
}

async function loadAll(){
  const [c,l,f,i] = await Promise.all([
    sb.from("clients").select("*").order("created_at"),
    sb.from("leads").select("*").order("created_at",{ascending:false}),
    sb.from("followups").select("*").order("due_date"),
    sb.from("interactions").select("*").order("created_at",{ascending:false})
  ]);
  D = { clients:c.data||[], leads:l.data||[], followups:f.data||[], interactions:i.data||[] };
}

async function refresh(){ await loadAll(); render(); }

/* ---------- auth & setup ---------- */
async function saveSetup(){
  const url = $("#su-url").value.trim(), key = $("#su-key").value.trim();
  if(!url || !key){ errMsg="Please fill both fields."; render(); return; }
  localStorage.setItem("scaylr_cfg", JSON.stringify({url,key}));
  errMsg=""; await boot();
}
async function signIn(){
  errMsg="";
  const { data, error } = await sb.auth.signInWithPassword({ email:$("#li-em").value.trim(), password:$("#li-pw").value });
  if(error){ errMsg=error.message; render(); return; }
  user = data.user; await loadAll(); render();
}
async function signOut(){ await sb.auth.signOut(); user=null; render(); }

/* ---------- data ops ---------- */
async function saveClient(id){
  const b = {
    name: $("#c-name").value.trim(),
    industry: $("#c-ind").value.trim(),
    base_fee: parseFloat($("#c-fee").value)||0,
    commission_pct: parseFloat($("#c-pct").value)||10,
    extra_fields: $("#c-extra").value.trim(),
    notes: $("#c-notes").value.trim()
  };
  if(!b.name){ errMsg="Client needs a name."; render(); return; }
  errMsg="";
  if(id) await sb.from("clients").update(b).eq("id",id);
  else await sb.from("clients").insert(b);
  modal=null; await refresh();
}
async function delClient(id){
  if(!confirm("Delete this client and ALL their leads? This cannot be undone.")) return;
  await sb.from("clients").delete().eq("id",id);
  modal=null; await refresh();
}
function extraFieldNames(client){
  return (client && client.extra_fields ? client.extra_fields.split(",") : []).map(s=>s.trim()).filter(Boolean);
}
async function saveLead(id){
  const cid = $("#l-client").value;
  const client = D.clients.find(c=>c.id===cid);
  const extra = {};
  extraFieldNames(client).forEach((f,i)=>{ extra[f] = $("#l-x"+i).value.trim(); });
  const b = {
    client_id: cid,
    name: $("#l-name").value.trim(),
    contact: $("#l-contact").value.trim(),
    source: $("#l-source").value,
    notes: $("#l-notes").value.trim(),
    extra
  };
  if(!b.name || !cid){ errMsg="Lead needs a name and a client."; render(); return; }
  errMsg="";
  if(id) await sb.from("leads").update(b).eq("id",id);
  else await sb.from("leads").insert(b);
  modal=null; await refresh();
}
async function delLead(id){
  if(!confirm("Delete this lead?")) return;
  await sb.from("leads").delete().eq("id",id);
  modal=null; await refresh();
}
async function setStatus(id, st){
  const b = { status: st };
  if(st==="Closed Won"){
    const v = prompt("Deal value ($)? This calculates your commission.");
    if(v===null) return;
    b.deal_value = parseFloat(v)||0;
    b.closed_at = new Date().toISOString();
  } else if(st==="Closed Lost"){ b.closed_at = new Date().toISOString(); }
  else { b.closed_at = null; }
  await sb.from("leads").update(b).eq("id",id);
  await loadAll();
  modal = {type:"lead-view", id};
  render();
}
async function addFollowup(leadId){
  const due = $("#f-due").value, note = $("#f-note").value.trim();
  if(!due){ errMsg="Pick a date."; render(); return; }
  errMsg="";
  await sb.from("followups").insert({ lead_id:leadId, due_date:due, note });
  await loadAll(); modal={type:"lead-view", id:leadId}; render();
}
async function toggleFollowup(id, done, backTo){
  await sb.from("followups").update({done}).eq("id",id);
  await loadAll();
  if(backTo) modal={type:"lead-view", id:backTo};
  render();
}
async function addInteraction(leadId){
  const note = $("#i-note").value.trim();
  if(!note){ errMsg="Write something first."; render(); return; }
  errMsg="";
  await sb.from("interactions").insert({ lead_id:leadId, kind:$("#i-kind").value, note });
  await loadAll(); modal={type:"lead-view", id:leadId}; render();
}

/* ---------- commission helpers ---------- */
function commissionFor(l){
  const c = clientOf(l);
  return (Number(l.deal_value)||0) * ((c ? Number(c.commission_pct) : 10)/100);
}
function monthWon(){
  const now = new Date();
  return D.leads.filter(l => l.status==="Closed Won" && l.closed_at &&
    new Date(l.closed_at).getMonth()===now.getMonth() && new Date(l.closed_at).getFullYear()===now.getFullYear());
}

/* ---------- views ---------- */
function render(){
  const app = $("#app");
  if(!cfg()){ app.innerHTML = vSetup(); return; }
  if(!user){ app.innerHTML = vLogin(); return; }
  let body = "";
  if(view==="dash") body = vDash();
  if(view==="clients") body = vClients();
  if(view==="leads") body = vLeads();
  if(view==="fups") body = vFups();
  app.innerHTML = vHeader() + body + (modal ? vModal() : "");
}

function vSetup(){ return `
  <div class="auth-box card">
    <h3>Connect Scaylr Ops</h3>
    <p class="mut">One-time setup. Paste the two values from your Supabase project (Settings → API). Your teammate does the same on their computer.</p>
    <label>Project URL</label><input id="su-url" placeholder="https://xxxx.supabase.co">
    <label>Anon public key</label><input id="su-key" placeholder="eyJhbG...">
    <div class="err">${esc(errMsg)}</div>
    <div class="m-foot"><button class="btn" onclick="saveSetup()">Connect</button></div>
  </div>`;
}
function vLogin(){ return `
  <div class="auth-box card">
    <h3><span style="color:var(--teal)">Scaylr</span> Ops — Sign in</h3>
    <label>Email</label><input id="li-em" type="email">
    <label>Password</label><input id="li-pw" type="password" onkeydown="if(event.key==='Enter')signIn()">
    <div class="err">${esc(errMsg)}</div>
    <div class="m-foot">
      <button class="ghost" onclick="localStorage.removeItem('scaylr_cfg');location.reload()">Reset connection</button>
      <button class="btn" onclick="signIn()">Sign in</button>
    </div>
  </div>`;
}
function vHeader(){
  const tabs = [["dash","Dashboard"],["clients","Clients"],["leads","Leads"],["fups","Follow-ups"]];
  return `<header>
    <div class="logo"><span>SCAYLR</span> OPS</div>
    <nav>${tabs.map(t=>`<button class="${view===t[0]?'on':''}" onclick="view='${t[0]}';modal=null;render()">${t[1]}</button>`).join("")}</nav>
    <div class="spacer"></div>
    <button class="ghost" onclick="signOut()">Sign out</button>
  </header>`;
}

function vDash(){
  const open = D.leads.filter(l=>!l.status.startsWith("Closed"));
  const fupsOpen = D.followups.filter(f=>!f.done);
  const over = fupsOpen.filter(f=>f.due_date < today());
  const due = fupsOpen.filter(f=>f.due_date === today());
  const won = monthWon();
  const comm = won.reduce((a,l)=>a+commissionFor(l),0);
  const byClient = D.clients.map(c=>{
    const w = won.filter(l=>l.client_id===c.id);
    return { c, n:w.length, val:w.reduce((a,l)=>a+(Number(l.deal_value)||0),0), comm:w.reduce((a,l)=>a+commissionFor(l),0) };
  });
  const totalBase = D.clients.reduce((a,c)=>a+(Number(c.base_fee)||0),0);
  return `
  <div class="grid g4">
    <div class="card stat"><div class="lab">Open leads</div><div class="val">${open.length}</div></div>
    <div class="card stat"><div class="lab">Follow-ups today</div><div class="val" style="color:${due.length?'var(--amber)':'inherit'}">${due.length}</div></div>
    <div class="card stat"><div class="lab">Overdue</div><div class="val" style="color:${over.length?'var(--red)':'inherit'}">${over.length}</div></div>
    <div class="card stat"><div class="lab">Commission this month</div><div class="val money">${money(comm)}</div></div>
  </div>
  <h2>This month per client</h2>
  <div class="card">
    ${byClient.length? byClient.map(r=>`
      <div class="row" onclick="leadFilter={client:'${r.c.id}',status:'open'};view='leads';render()">
        <strong>${esc(r.c.name)}</strong>
        <span class="tag">base ${money(r.c.base_fee)}/mo</span>
        <div class="spacer"></div>
        <span class="mut">${r.n} closed · ${money(r.val)} in deals</span>
        <span class="money">+${money(r.comm)}</span>
      </div>`).join("") : `<div class="empty">Add your first client to get started.</div>`}
    ${byClient.length?`<div class="row" style="cursor:default"><span class="mut">Base fees total</span><div class="spacer"></div><span class="money">+${money(totalBase)}/mo</span></div>`:""}
  </div>
  <h2>Needs your attention</h2>
  <div class="card">
    ${(over.concat(due)).length ? over.concat(due).map(f=>fupRow(f)).join("") : `<div class="empty">Nothing overdue. Clean slate.</div>`}
  </div>`;
}

function vClients(){
  return `
  <div class="flex" style="justify-content:space-between;margin-bottom:12px">
    <h3 style="margin:0">Clients</h3>
    <button class="btn sm" onclick="modal={type:'client-edit'};render()">+ Add client</button>
  </div>
  <div class="card">
    ${D.clients.length ? D.clients.map(c=>{
      const open = D.leads.filter(l=>l.client_id===c.id && !l.status.startsWith("Closed")).length;
      return `<div class="row" onclick="modal={type:'client-edit',id:'${c.id}'};render()">
        <strong>${esc(c.name)}</strong><span class="tag">${esc(c.industry||"—")}</span>
        <div class="spacer"></div>
        <span class="mut">${open} open leads · ${money(c.base_fee)}/mo · ${Number(c.commission_pct)}%</span>
      </div>`;
    }).join("") : `<div class="empty">No clients yet. Add Fusion Media and your event client.</div>`}
  </div>`;
}

function vLeads(){
  let list = D.leads;
  if(leadFilter.client!=="all") list = list.filter(l=>l.client_id===leadFilter.client);
  if(leadFilter.status==="open") list = list.filter(l=>!l.status.startsWith("Closed"));
  else if(leadFilter.status!=="all") list = list.filter(l=>l.status===leadFilter.status);
  return `
  <div class="flex" style="justify-content:space-between;margin-bottom:12px">
    <div class="flex">
      <select style="width:auto" onchange="leadFilter.client=this.value;render()">
        <option value="all">All clients</option>
        ${D.clients.map(c=>`<option value="${c.id}" ${leadFilter.client===c.id?'selected':''}>${esc(c.name)}</option>`).join("")}
      </select>
      <select style="width:auto" onchange="leadFilter.status=this.value;render()">
        <option value="open" ${leadFilter.status==='open'?'selected':''}>Open</option>
        <option value="all" ${leadFilter.status==='all'?'selected':''}>All</option>
        ${STATUSES.map(s=>`<option ${leadFilter.status===s?'selected':''}>${s}</option>`).join("")}
      </select>
    </div>
    <button class="btn sm" onclick="modal={type:'lead-edit'};render()">+ Add lead</button>
  </div>
  <div class="card">
    ${list.length ? list.map(l=>{
      const c = clientOf(l);
      const nf = D.followups.filter(f=>f.lead_id===l.id && !f.done).sort((a,b)=>a.due_date<b.due_date?-1:1)[0];
      const dueCls = nf ? (nf.due_date<today() ? "due-over" : nf.due_date===today() ? "due-today" : "mut") : "mut";
      return `<div class="row" onclick="modal={type:'lead-view',id:'${l.id}'};render()">
        <strong>${esc(l.name)}</strong>
        <span class="pill ${cls(l.status)}">${l.status}</span>
        <span class="tag">${esc(c?c.name:"?")}</span>
        <div class="spacer"></div>
        ${l.status==="Closed Won"?`<span class="money">${money(l.deal_value)} → +${money(commissionFor(l))}</span>`:""}
        <span class="${dueCls}">${nf ? "next: "+fmtD(nf.due_date) : "no follow-up"}</span>
      </div>`;
    }).join("") : `<div class="empty">No leads here yet.</div>`}
  </div>`;
}

function fupRow(f, backTo){
  const l = D.leads.find(x=>x.id===f.lead_id); if(!l) return "";
  const c = clientOf(l);
  const dcls = f.due_date<today() ? "due-over" : f.due_date===today() ? "due-today" : "mut";
  return `<div class="row" onclick="modal={type:'lead-view',id:'${l.id}'};render()">
    <input type="checkbox" ${f.done?"checked":""} style="width:auto" onclick="event.stopPropagation()" onchange="toggleFollowup('${f.id}',this.checked,${backTo?`'${backTo}'`:"null"})">
    <strong>${esc(l.name)}</strong><span class="tag">${esc(c?c.name:"?")}</span>
    <span class="mut">${esc(f.note||"")}</span>
    <div class="spacer"></div><span class="${dcls}">${fmtD(f.due_date)}</span>
  </div>`;
}

function vFups(){
  const open = D.followups.filter(f=>!f.done);
  const over = open.filter(f=>f.due_date<today());
  const due = open.filter(f=>f.due_date===today());
  const up = open.filter(f=>f.due_date>today());
  const sec = (title,arr) => `<h2>${title}</h2><div class="card">${arr.length?arr.map(f=>fupRow(f)).join(""):`<div class="empty">None.</div>`}</div>`;
  return sec(`Overdue (${over.length})`,over) + sec(`Today (${due.length})`,due) + sec("Upcoming",up);
}

/* ---------- modals ---------- */
function vModal(){
  let inner = "";
  if(modal.type==="client-edit") inner = mClient();
  if(modal.type==="lead-edit") inner = mLeadEdit();
  if(modal.type==="lead-view") inner = mLeadView();
  return `<div class="modal-bg" onclick="if(event.target===this){modal=null;errMsg='';render()}"><div class="modal">${inner}</div></div>`;
}

function mClient(){
  const c = modal.id ? D.clients.find(x=>x.id===modal.id) : {};
  return `<h3>${modal.id?"Edit client":"New client"}</h3>
  <label>Name</label><input id="c-name" value="${esc(c.name||"")}">
  <label>Industry</label><input id="c-ind" value="${esc(c.industry||"")}" placeholder="Marketing agency / Event management">
  <div class="grid" style="grid-template-columns:1fr 1fr">
    <div><label>Base fee ($/month)</label><input id="c-fee" type="number" value="${c.base_fee||''}"></div>
    <div><label>Commission %</label><input id="c-pct" type="number" value="${c.commission_pct||10}"></div>
  </div>
  <label>Custom lead fields (comma-separated)</label>
  <input id="c-extra" value="${esc(c.extra_fields||"")}" placeholder="Event type, Event date, Venue, Guest count, Requirements">
  <p class="mut" style="margin-top:4px;font-size:12px">These become extra boxes on every lead for this client — e.g. lighting &amp; sound requirements for the event company.</p>
  <label>Notes</label><textarea id="c-notes">${esc(c.notes||"")}</textarea>
  <div class="err">${esc(errMsg)}</div>
  <div class="m-foot">
    ${modal.id?`<button class="ghost danger" onclick="delClient('${modal.id}')">Delete</button>`:""}
    <button class="ghost" onclick="modal=null;errMsg='';render()">Cancel</button>
    <button class="btn" onclick="saveClient(${modal.id?`'${modal.id}'`:"null"})">Save</button>
  </div>`;
}

function mLeadEdit(){
  const l = modal.id ? D.leads.find(x=>x.id===modal.id) : { extra:{} };
  const selId = l.client_id || (D.clients[0]&&D.clients[0].id) || "";
  const client = D.clients.find(c=>c.id===selId);
  return `<h3>${modal.id?"Edit lead":"New lead"}</h3>
  <label>Client</label>
  <select id="l-client" onchange="modal.tmpClient=this.value;render()">
    ${D.clients.map(c=>`<option value="${c.id}" ${(modal.tmpClient||selId)===c.id?"selected":""}>${esc(c.name)}</option>`).join("")}
  </select>
  <label>Lead name</label><input id="l-name" value="${esc(l.name||"")}">
  <label>Contact (IG handle / phone)</label><input id="l-contact" value="${esc(l.contact||"")}">
  <label>Source</label>
  <select id="l-source">${SOURCES.map(s=>`<option ${l.source===s?"selected":""}>${s}</option>`).join("")}</select>
  ${extraFieldNames(D.clients.find(c=>c.id===(modal.tmpClient||selId))||client).map((f,i)=>
    `<label>${esc(f)}</label><input id="l-x${i}" value="${esc((l.extra||{})[f]||"")}">`).join("")}
  <label>Notes</label><textarea id="l-notes">${esc(l.notes||"")}</textarea>
  <div class="err">${esc(errMsg)}</div>
  <div class="m-foot">
    <button class="ghost" onclick="modal=null;errMsg='';render()">Cancel</button>
    <button class="btn" onclick="saveLead(${modal.id?`'${modal.id}'`:"null"})">Save</button>
  </div>`;
}

function mLeadView(){
  const l = D.leads.find(x=>x.id===modal.id); if(!l){ modal=null; return ""; }
  const c = clientOf(l);
  const fups = D.followups.filter(f=>f.lead_id===l.id).sort((a,b)=>a.due_date<b.due_date?-1:1);
  const ints = D.interactions.filter(i=>i.lead_id===l.id);
  const extras = Object.entries(l.extra||{}).filter(([k,v])=>v);
  return `
  <div class="flex" style="justify-content:space-between">
    <h3 style="margin:0">${esc(l.name)}</h3>
    <button class="ghost" onclick="modal={type:'lead-edit',id:'${l.id}'};render()">Edit</button>
  </div>
  <p class="mut" style="margin-top:4px">${esc(c?c.name:"?")} · ${esc(l.source)} ${l.contact?"· "+esc(l.contact):""}</p>
  <div class="statusbtns">
    ${STATUSES.map(s=>`<button class="${l.status===s?'on':''}" onclick="setStatus('${l.id}','${s}')">${s}</button>`).join("")}
  </div>
  ${l.status==="Closed Won"?`<p style="margin-top:10px">Deal: <span class="money">${money(l.deal_value)}</span> → your commission: <span class="money">${money(commissionFor(l))}</span></p>`:""}
  ${extras.length?`<div style="margin-top:12px">${extras.map(([k,v])=>`<p style="font-size:13px;margin:3px 0"><span class="mut">${esc(k)}:</span> ${esc(v)}</p>`).join("")}</div>`:""}
  ${l.notes?`<p class="mut" style="margin-top:10px;white-space:pre-wrap">${esc(l.notes)}</p>`:""}

  <h3 style="margin-top:18px">Follow-ups</h3>
  ${fups.length?fups.map(f=>`
    <div class="flex" style="padding:4px 0">
      <input type="checkbox" ${f.done?"checked":""} style="width:auto" onchange="toggleFollowup('${f.id}',this.checked,'${l.id}')">
      <span class="${f.done?"mut":(f.due_date<today()?"due-over":f.due_date===today()?"due-today":"")}">${fmtD(f.due_date)}</span>
      <span class="mut">${esc(f.note||"")}</span>
    </div>`).join(""):`<p class="mut">None yet.</p>`}
  <div class="flex" style="margin-top:8px">
    <input id="f-due" type="date" style="width:auto" value="${today()}">
    <input id="f-note" placeholder="e.g. send package details" style="flex:1">
    <button class="btn sm" onclick="addFollowup('${l.id}')">Add</button>
  </div>

  <h3 style="margin-top:18px">Activity log</h3>
  <div class="flex" style="margin-bottom:10px">
    <select id="i-kind" style="width:auto"><option>Note</option><option>DM</option><option>Call</option><option>Meeting</option></select>
    <input id="i-note" placeholder="What happened?" style="flex:1" onkeydown="if(event.key==='Enter')addInteraction('${l.id}')">
    <button class="btn sm" onclick="addInteraction('${l.id}')">Log</button>
  </div>
  ${ints.map(i=>`<div class="int"><span class="tag">${esc(i.kind)}</span> <span class="mut" style="font-size:12px">${new Date(i.created_at).toLocaleDateString(undefined,{day:"numeric",month:"short"})}</span><br>${esc(i.note)}</div>`).join("")}
  <div class="err">${esc(errMsg)}</div>
  <div class="m-foot">
    <button class="ghost danger" onclick="delLead('${l.id}')">Delete lead</button>
    <button class="ghost" onclick="modal=null;errMsg='';render()">Close</button>
  </div>`;
}

boot();
</script>
</body>
</html>
